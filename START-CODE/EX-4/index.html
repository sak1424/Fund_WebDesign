<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">
                <h1><i class="fa-solid fa-leaf"></i> Vexis</h1>
            </div>
            <div class="nav">
                    <div class="nav-items current">
                        <p><i class="fa-solid fa-list"></i>   Dashboard</p>
                    </div>
                    <div class="nav-items">
                        <p><i class="fa-solid fa-user"></i>    Users</p>
                    </div>
                    <div class="nav-items">
                        <p><i class="fa-solid fa-gear"></i>Settings</p>
                    </div>
                    <div class="nav-items log">
                        <p><i class="fa-solid fa-right-to-bracket"></i> log out</p>
                    </div>
            </div>
        </div>
        <div class="main">
            <div class="bar">
                <div class="welcome">
                    Welcome back user!
                </div>
                <div class="icon">
                    <img src="https://static.vecteezy.com/system/resources/previews/046/010/545/non_2x/user-icon-simple-design-free-vector.jpg"> user
                </div>
            </div>
            <div class="box">
                <div class="content">
                    <div class="search">
                        <div class="search-container">
                            <input type="text" placeholder="Search todo list">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </div>
                    </div>
                    <div class="list">
                        <i class="fa-solid fa-bars"></i><i class="fa-solid fa-pen-to-square"></i>to do list
                    </div>
                    <div class="list">
                        <i class="fa-solid fa-bars"></i><i class="fa-solid fa-pen-to-square"></i>to do list
                    </div>
                    <div class="list">
                        <i class="fa-solid fa-bars"></i><i class="fa-solid fa-pen-to-square"></i>to do list
                    </div>
                    <div class="list">
                        <i class="fa-solid fa-bars"></i><i class="fa-solid fa-pen-to-square"></i>to do list
                    </div>
                    <div class="list">
                        <i class="fa-solid fa-bars"></i><i class="fa-solid fa-pen-to-square"></i>to do list
                    </div>
                    <div class="list">
                        <i class="fa-solid fa-bars"></i><i class="fa-solid fa-pen-to-square"></i>to do list
                    </div>
                    <div class="list">
                        <i class="fa-solid fa-bars"></i><i class="fa-solid fa-pen-to-square"></i>to do list
                    </div>
                    <div class="list">
                        <i class="fa-solid fa-bars"></i><i class="fa-solid fa-pen-to-square"></i>to do ist
                    </div>
                </div>
                <div class="right-bar">
                    <div class="task current-task">
                        <i class="fa-solid fa-list fa"></i>All task
                    </div>
                    <div class="task">
                        <i class="fa-solid fa-pen fa"></i>My task
                    </div>
                    <div class="task">
                        <i class="fa-solid fa-heart fa"></i>favourite
                    </div>
                    <div class="task">
                        <i class="fa-solid fa-check fa"></i>Done
                    </div>
                    <div class="task">
                        <i class="fa-solid fa-trash fa"></i>Deleted
                    </div>
                </div>
            </div> 
        </div>
    </div>
    
</body>
</html>
